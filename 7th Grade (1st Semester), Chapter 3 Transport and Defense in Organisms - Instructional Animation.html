<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生物的運輸與防禦 教學動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：左邊是動畫舞台與播放控制，右邊是可遮字背誦的重點筆記；窄螢幕時上下堆疊 */
  --paper:#f1f5ee; --card:#ffffff; --ink:#17251f; --muted:#56665e; --line:#d3dcd1;
  --accent:#1f7a5c; --accent-soft:#dcefe6; --memo:#fff4cc;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:18px 20px 12px;max-width:1280px;margin:0 auto}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.08em}
h1{font-family:var(--display);font-size:26px;margin:0;line-height:1.25}
nav{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.k:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
nav button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:18px;padding:0 20px 28px;max-width:1280px;margin:0 auto;align-items:start}
.stage,.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stagehead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px}
#num{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
svg#svg{display:block;width:100%;height:auto;background:#fbfcfa;border:1px solid var(--line);border-radius:12px}
svg text{font-family:var(--body)}
.cap{min-height:3.2em;margin:10px 2px 8px;font-size:17px;font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;min-width:116px;padding:10px 16px}
.primary:hover{filter:brightness(1.08)}
#seek{flex:1 1 160px;accent-color:var(--accent);min-width:120px}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;justify-content:center;flex:1 1 200px}
#steps button{width:30px;height:30px;padding:0;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
#steps button.seen{background:var(--accent-soft);border-color:var(--accent)}
#steps button[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#steps li.gap{width:8px}
#next.ready{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.noteshead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h3{font-family:var(--display);font-size:19px;margin:0}
#recite[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#points{margin:12px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:9px}
.k{font-weight:700;color:var(--accent);border-radius:4px;padding:0 2px}
.reciting .k{color:transparent;background:var(--accent-soft);border-bottom:2px solid var(--accent);cursor:pointer;user-select:none}
.reciting .k.open{color:var(--accent);background:none;border-bottom-color:transparent}
.rhyme{background:var(--memo);border-radius:12px;padding:10px 14px}
.rhyme span{font-size:12px;font-weight:700;letter-spacing:.1em;color:#7a5a00}
.rhyme p{margin:2px 0 0;font-family:var(--display);font-size:19px;line-height:1.5}
.hint{font-size:14px;color:var(--muted);margin:12px 2px 0}
@media (max-width:860px){main{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">國中自然 1 上・第 3 章</div><h1>生物的運輸與防禦</h1></div>
  <nav id="units" aria-label="單元"></nav>
</header>
<main>
  <section class="stage" aria-label="動畫">
    <div class="stagehead"><span id="num"></span><h2 id="title"></h2></div>
    <svg id="svg" viewBox="0 0 800 450" role="img" aria-labelledby="title">
      <defs>
        <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d43d3d"/></marker>
        <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a63c9"/></marker>
        <marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56665e"/></marker>
        <linearGradient id="gcap" gradientUnits="userSpaceOnUse" x1="270" x2="530" y1="0" y2="0"><stop offset="0" stop-color="#e86a5e"/><stop offset="1" stop-color="#7f8fe0"/></linearGradient>
        <linearGradient id="gcap2" gradientUnits="userSpaceOnUse" x1="40" x2="520" y1="0" y2="0"><stop offset="0" stop-color="#f08a80"/><stop offset="1" stop-color="#a9b4ea"/></linearGradient>
      </defs>
      <g id="stat"></g><g id="dyn"></g>
    </svg>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="controls">
      <button id="play" class="primary" type="button">▶ 開始</button>
      <button id="replay" type="button">↺ 從頭播放</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="動畫進度">
    </div>
    <div class="nav">
      <button id="prev" type="button">← 上一階段</button>
      <ol id="steps" aria-label="階段"></ol>
      <button id="next" type="button">下一階段 →</button>
    </div>
  </section>
  <aside class="notes" id="notes" aria-label="重點歸納">
    <div class="noteshead"><h3>重點歸納</h3><button id="recite" type="button" aria-pressed="false">背誦模式：遮住關鍵字</button></div>
    <ul id="points"></ul>
    <div class="rhyme"><span>背誦口訣</span><p id="rhyme"></p></div>
    <p class="hint" id="hint"></p>
  </aside>
</main>

<script id="stages">
/* ---------- 繪圖小工具（只回傳 SVG 字串，不碰 DOM） ---------- */
const C={water:'#2b7bd6',nut:'#e08a1e',red:'#d43d3d',blue:'#4a63c9',green:'#1f8f5f',ink:'#17251f',mut:'#56665e',germ:'#8a4fc7',acc:'#1f7a5c'};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const n1=n=>(Math.round(n*10)/10);
const dot=(x,y,r,fill,o=1,ex='')=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(r)}" fill="${fill}" opacity="${n1(o*100)/100}" ${ex}/>`;
const T=(x,y,s,o={})=>`<text x="${n1(x)}" y="${n1(y)}" text-anchor="${o.a||'middle'}" font-size="${o.z||17}" font-weight="${o.w||500}" fill="${o.f||C.ink}" opacity="${n1((o.o??1)*100)/100}">${s}</text>`;
const along=(pts,s)=>{for(let i=1;i<pts.length;i++){const[ax,ay]=pts[i-1],[bx,by]=pts[i],d=Math.hypot(bx-ax,by-ay);if(s<=d||i===pts.length-1){const p=d?cl(s/d):0;return[ax+(bx-ax)*p,ay+(by-ay)*p];}s-=d;}};
const plen=pts=>pts.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);
const bundle=(x,y,deg,s,camb,xo=1,po=1)=>`<g transform="translate(${n1(x)} ${n1(y)}) rotate(${n1(deg)}) scale(${n1(s*100)/100})"><ellipse cx="11" cy="0" rx="9" ry="11" fill="${C.nut}" opacity="${po}"/><ellipse cx="-9" cy="0" rx="11" ry="12" fill="${C.water}" opacity="${xo}"/>${camb?`<rect x="-.5" y="-12" width="4" height="24" fill="#2fae6b"/>`:''}</g>`;

const UNITS=['植物的運輸','人體的循環','人體的防禦'];
const S=[];

/* ---------- 1 維管束 ---------- */
S.push({unit:0,title:'維管束：植物的兩條運輸管',dur:14,loop:true,
svg:`<rect x="0" y="330" width="800" height="120" fill="#e6d9bb"/>
<circle cx="700" cy="66" r="30" fill="#f6c545"/>${T(700,120,'日光',{z:14})}
<path d="M400 405L330 440M400 405L470 440M400 405L400 446" stroke="#a98d5b" stroke-width="7" stroke-linecap="round"/>
<rect x="368" y="100" width="64" height="310" rx="8" fill="#cfe6c4" stroke="#7fae78"/>
<rect x="378" y="104" width="18" height="302" rx="6" fill="#d6e6fb"/><rect x="404" y="104" width="18" height="302" rx="6" fill="#fbe6c6"/>
<path d="M432 175Q500 110 600 150Q520 215 432 175Z" fill="#8cc97a"/><path d="M368 200Q300 135 200 175Q280 240 368 200Z" fill="#8cc97a"/>
<circle cx="400" cy="78" r="30" fill="#f3a6b8"/>${T(400,38,'花、果實',{z:14})}
${T(612,158,'葉：行光合作用，製造養分',{a:'start',z:14})}
${T(352,278,'木質部',{a:'end',f:C.water,w:700,z:20})}${T(352,302,'水分、礦物質 ↑',{a:'end'})}
${T(448,278,'韌皮部',{a:'start',f:C.nut,w:700,z:20})}${T(448,302,'養分 ↑↓',{a:'start'})}
${T(40,400,'根：吸收水分和礦物質',{a:'start',z:14})}`,
caps:[[0,'維管束是成束排列的運輸細胞，從根、莖一路延伸到葉、花和果實。'],[4,'藍色是木質部：把根吸收的水分和礦物質往上送。'],[9,'橘色是韌皮部：把葉製造的養分送到需要的地方，可以向上，也可以向下。']],
tick(t){let h='';const p=t/14;
 for(let i=0;i<6;i++){const ph=(p*3+i/6)%1;h+=dot(387,404-296*ph,6,C.water);}
 for(let i=0;i<6;i++){const ph=(p*2+i/6)%1,right=i%2===0;const sx=right?520:290,sy=right?165:188,jy=right?178:202;
  let x,y;if(ph<.25){const q=ph/.25;x=lerp(sx,413,q);y=lerp(sy,jy,q);}else{const q=(ph-.25)/.75;x=413;y=i%4<2?lerp(jy,108,q):lerp(jy,402,q);}
  h+=dot(x,y,6,C.nut);}
 return h;},
points:['植物體內負責運輸的細胞排列成束，稱為<b>維管束</b>，由根、莖延伸到葉、花、果實。','<b>木質部</b>運輸<b>水分和礦物質</b>，方向<b>由下往上</b>；細胞壁較厚，還有<b>支持</b>的功能。','<b>韌皮部</b>運輸光合作用製造的<b>養分</b>，可以<b>向上也可以向下</b>。'],
rhyme:'木送水、韌送養；水只往上，養分雙向。'});

/* ---------- 2 位置 ---------- */
S.push({unit:0,title:'木質部和韌皮部在哪裡',dur:12,loop:false,
svg:`${T(220,60,'莖的橫切面',{w:700,z:20})}<circle cx="220" cy="225" r="130" fill="#dcebd2" stroke="#7fae78" stroke-width="3"/>
${T(615,100,'葉的橫切面',{w:700,z:20})}<rect x="470" y="150" width="290" height="150" rx="20" fill="#b4dba0"/>
<rect x="470" y="150" width="290" height="18" rx="9" fill="#7dbb6a"/><rect x="470" y="282" width="290" height="18" rx="9" fill="#7dbb6a"/>
${T(770,144,'上表皮',{a:'end',z:13,f:C.mut})}${T(770,318,'下表皮',{a:'end',z:13,f:C.mut})}`,
caps:[[0,'切開莖和葉，找一找木質部（藍）和韌皮部（橘）的位置。'],[2,'木質部：在莖的內側；在葉脈裡靠上面。'],[6,'韌皮部：在莖的外側；在葉脈裡靠下面。'],[10,'記起來：莖是「木內韌外」，葉是「木上韌下」。']],
tick(t){const xo=(t>=6&&t<10)?.2:1,po=(t>=2&&t<6)?.2:1;let h='';
 for(let k=0;k<8;k++){const a=k*Math.PI/4;h+=bundle(220+88*Math.cos(a),225+88*Math.sin(a),k*45,1.25,false,xo,po);}
 h+=`<path d="M570 225A45 38 0 0 1 660 225Z" fill="${C.water}" opacity="${xo}"/><path d="M570 225A45 38 0 0 0 660 225Z" fill="${C.nut}" opacity="${po}"/>`;
 h+=T(220,392,'木質部在內側',{f:C.water,w:700,o:xo})+T(220,418,'韌皮部在外側',{f:C.nut,w:700,o:po});
 h+=T(615,345,'木質部在上側（靠近上表皮）',{f:C.water,w:700,o:xo})+T(615,371,'韌皮部在下側（靠近下表皮）',{f:C.nut,w:700,o:po});
 return h;},
points:['莖：木質部在<b>內</b>側，韌皮部在<b>外</b>側。','葉脈就是葉內的<b>維管束</b>。','葉：木質部在<b>上</b>側（靠近上表皮），韌皮部在<b>下</b>側（靠近下表皮）。'],
rhyme:'莖「木內韌外」，葉「木上韌下」。'});

/* ---------- 3 排列 ---------- */
const SC=[[0,0],[.35,.1],[-.3,.2],[.1,-.4],[-.15,-.25],[.55,-.3],[-.55,-.2],[.2,.5],[-.4,.55],[.7,.25],[-.72,.2],[0,.78],[.3,-.72],[-.35,-.68]];
S.push({unit:0,title:'莖內維管束的兩種排列',dur:14,loop:false,
svg:`${T(210,48,'環狀排列',{w:700,z:22})}${T(590,48,'散生排列',{w:700,z:22})}
${T(210,385,'有形成層，莖可以加粗',{w:700})}${T(210,410,'例：向日葵、榕樹',{z:15})}${T(210,432,'（向日葵的葉脈是網狀脈）',{z:13,f:C.mut})}
${T(590,385,'通常沒有形成層',{w:700})}${T(590,410,'例：玉米、水稻',{z:15})}${T(590,432,'（玉米的葉脈是平行脈）',{z:13,f:C.mut})}`,
caps:[[0,'不同植物的莖，維管束排列方式不一樣。'],[1,'環狀排列：維管束圍成一圈，木質部和韌皮部之間有形成層（綠色）。'],[4.5,'散生排列：維管束分散在莖裡，通常沒有形成層。'],[8,'形成層會細胞分裂，向外長新的韌皮部、向內長新的木質部，莖就變粗了。']],
tick(t){const g=sg(t,8,13),r=105+25*g,lo=(t>=4.5&&t<8)?.3:1,ro=((t>=1&&t<4.5)||t>=8&&t<13)?.3:1;
 let h=`<g opacity="${lo}"><circle cx="210" cy="205" r="${n1(r)}" fill="#dcebd2" stroke="#7fae78" stroke-width="3"/><circle cx="210" cy="205" r="${n1(r*.64)}" fill="none" stroke="#2fae6b" stroke-width="${n1(2+3*g)}" stroke-dasharray="5 5"/>`;
 for(let k=0;k<8;k++){const a=k*Math.PI/4;h+=bundle(210+r*.64*Math.cos(a),205+r*.64*Math.sin(a),k*45,1+.45*g,true);}
 h+=`</g><g opacity="${ro}"><circle cx="590" cy="205" r="105" fill="#dcebd2" stroke="#7fae78" stroke-width="3"/>`;
 SC.forEach(([dx,dy])=>{h+=bundle(590+dx*105*.95,205+dy*105*.95,Math.atan2(dy,dx)*180/Math.PI,.75,false);});
 h+='</g>';if(g>0)h+=T(210,210,'加粗',{w:700,z:20,f:C.acc,o:g});return h;},
points:['<b>環狀</b>排列：例如向日葵、榕樹；木質部與韌皮部之間有<b>形成層</b>。','<b>散生</b>排列：例如玉米、水稻；通常<b>不具</b>形成層。','形成層可細胞分裂：向<b>外</b>增生韌皮部，向<b>內</b>增生木質部，使莖<b>加粗</b>。'],
rhyme:'環狀有層能加粗，散生無層不加粗。'});

/* ---------- 4 年輪 ---------- */
S.push({unit:0,title:'樹皮與年輪',dur:17,loop:false,
svg:`${T(270,432,'外圈是樹皮（含韌皮部）；裡面的木材由木質部逐年堆積而成',{z:14,f:C.mut})}`,
caps:[[0,'樹木每年都向外長出新的木質部，堆積成木材。'],[0.5,'春夏溫暖多雨，細胞長得快又大，木材顏色淺。'],[2.6,'秋冬寒冷乾燥，細胞長得慢又小，木材顏色深。'],[4,'一圈淺色加一圈深色，就是一年的年輪。繼續看它長大。'],[16,'數一數：四圈深色，這棵樹 4 歲。']],
tick(t){const yrs=Math.min(4,t/4),bands=[];let r=14;
 for(let y=0;y<4;y++){const q=cl(yrs-y);if(q<=0)break;const a=cl(q/.65),b=cl((q-.65)/.35);r+=24*a;bands.push([r,'#ecd9ae']);if(b>0){r+=8*b;bands.push([r,'#9a6b3a']);}}
 let h=`<circle cx="270" cy="220" r="${n1(r+5)}" fill="#6b4a2b"/>`;
 for(let i=bands.length-1;i>=0;i--)h+=dot(270,220,bands[i][0],bands[i][1]);
 h+=dot(270,220,14,'#c9a877');
 const done=t>=16,q=(t/4)%1,spring=!done&&q<.65;
 h+=T(620,80,done?'樹齡：4 年':`第 ${Math.min(4,Math.floor(t/4)+1)} 年`,{w:700,z:26});
 const card=(y,on,ti,l1,fill)=>`<g opacity="${on?1:.4}"><rect x="470" y="${y}" width="300" height="96" rx="14" fill="${fill}" stroke="${on?C.acc:'#d3dcd1'}" stroke-width="${on?4:1}"/>${T(620,y+34,ti,{w:700,z:19})}${T(620,y+66,l1,{z:15})}</g>`;
 h+=card(110,done||spring,'春、夏：溫暖多雨','生長快・細胞大・顏色淺','#f6ecd2')+card(226,done||!spring,'秋、冬：寒冷乾燥','生長慢・細胞小・顏色深','#e2cdb0');
 return h;},
points:['樹皮包含<b>韌皮部</b>及其外圍構造；木材是逐年堆積的<b>木質部</b>。','春夏：細胞生長<b>快</b>、細胞<b>大</b>、木材顏色<b>淺</b>。','秋冬：細胞生長<b>慢</b>、細胞<b>小</b>、木材顏色<b>深</b>。','深淺交替形成<b>年輪</b>，可以用來推算樹齡。'],
rhyme:'春夏大而淺，秋冬小而深；一淺一深算一年。'});

/* ---------- 5 蒸散 ---------- */
const WP=[[50,395],[150,395],[176,380],[176,150],[215,128],[300,112],[332,62],[322,22]],WL=plen(WP);
S.push({unit:0,title:'水分運輸與蒸散作用',dur:14,loop:true,
svg:`<rect x="0" y="345" width="410" height="105" fill="#e6d9bb"/>
<path d="M166 372L118 392M166 388L112 412M186 376L232 396M186 392L238 416" stroke="#a98d5b" stroke-width="4" stroke-linecap="round"/>
<rect x="162" y="140" width="28" height="270" rx="6" fill="#cfe6c4" stroke="#7fae78"/><rect x="169" y="144" width="14" height="262" rx="5" fill="#d6e6fb"/>
<path d="M188 150Q240 78 345 104Q285 162 188 150Z" fill="#8cc97a"/>
${T(20,436,'根毛：增加吸收的表面積',{a:'start',z:14})}${T(20,372,'滲透作用',{a:'start',z:14,f:C.water,w:700})}

<script>
/* ---------- 播放器 ---------- */
(function(){
const $=id=>document.getElementById(id);
const stat=$('stat'),dyn=$('dyn'),cap=$('cap'),play=$('play'),seek=$('seek'),next=$('next'),prev=$('prev'),notes=$('notes');
let i=0,t=0,playing=false,last=0,reciting=false;const seen=new Set();
try{const v=parseInt(localStorage.getItem('ch3-stage'),10);if(v>=0&&v<S.length)i=v;}catch(e){}

S.forEach((s,k)=>{
  if(k>0&&s.unit!==S[k-1].unit){const g=document.createElement('li');g.className='gap';g.setAttribute('aria-hidden','true');$('steps').appendChild(g);}
  const li=document.createElement('li'),b=document.createElement('button');b.type='button';b.textContent=k+1;b.title=s.title;b.setAttribute('aria-label','階段 '+(k+1)+'：'+s.title);
  b.addEventListener('click',()=>go(k));li.appendChild(b);$('steps').appendChild(li);s.btn=b;});
UNITS.forEach((u,k)=>{const b=document.createElement('button');b.type='button';b.textContent=u;b.addEventListener('click',()=>go(S.findIndex(s=>s.unit===k)));$('units').appendChild(b);});

function local(){const s=S[i];return s.loop?t%s.dur:Math.min(t,s.dur);}
function draw(){const s=S[i],lt=local();dyn.innerHTML=s.tick(lt);
  let c=s.caps[0][1];for(const[a,txt]of s.caps)if(lt>=a)c=txt;if(cap.textContent!==c)cap.textContent=c;
  seek.value=Math.round(lt/s.dur*1000);}
function ui(){const s=S[i],end=!s.loop&&t>=s.dur;
  play.textContent=playing?'⏸ 暫停':end?'↺ 再看一次':t>0?'▶ 繼續':'▶ 開始';
  next.classList.toggle('ready',seen.has(i)&&i<S.length-1);next.disabled=i===S.length-1;prev.disabled=i===0;
  S.forEach((x,k)=>{x.btn.classList.toggle('seen',seen.has(k));x.btn.setAttribute('aria-current',k===i?'true':'false');});
  [...$('units').children].forEach((b,k)=>b.setAttribute('aria-current',k===s.unit?'true':'false'));
  $('hint').textContent=reciting?'點一下空格就能看答案。先在心裡說出答案，再點開核對。':seen.has(i)?(i<S.length-1?'看完了。試著不看筆記說一次重點，再按「下一階段」。':'全部看完了。開啟背誦模式，從第 1 階段再檢查一次自己。'):'按「開始」看動畫，隨時可以暫停或拖動進度條重看。';}
function go(k){i=cl(k,0,S.length-1);t=0;playing=false;const s=S[i];
  stat.innerHTML=s.svg;$('num').textContent=UNITS[s.unit]+'・階段 '+(i+1)+'／'+S.length;$('title').textContent=s.title;
  $('points').innerHTML=s.points.map(p=>'<li>'+p.replace(/<b>/g,'<b class="k" tabindex="0">')+'</li>').join('');$('rhyme').textContent=s.rhyme;
  try{localStorage.setItem('ch3-stage',i);}catch(e){}
  draw();ui();}
function frame(now){if(!playing)return;t+=Math.min(.1,(now-last)/1000);last=now;const s=S[i];
  if(t>=s.dur&&!seen.has(i)){seen.add(i);ui();}
  if(!s.loop&&t>=s.dur){t=s.dur;playing=false;ui();}
  draw();if(playing)requestAnimationFrame(frame);}
function toggle(){const s=S[i];if(playing){playing=false;}else{if(!s.loop&&t>=s.dur)t=0;playing=true;last=performance.now();requestAnimationFrame(frame);}ui();}

play.addEventListener('click',toggle);
$('replay').addEventListener('click',()=>{t=0;draw();if(!playing)toggle();});
seek.addEventListener('input',()=>{playing=false;t=seek.value/1000*S[i].dur;draw();ui();});
next.addEventListener('click',()=>go(i+1));prev.addEventListener('click',()=>go(i-1));
$('recite').addEventListener('click',e=>{reciting=!reciting;notes.classList.toggle('reciting',reciting);e.currentTarget.setAttribute('aria-pressed',reciting);e.currentTarget.textContent=reciting?'顯示全部關鍵字':'背誦模式：遮住關鍵字';notes.querySelectorAll('.k.open').forEach(k=>k.classList.remove('open'));ui();});
$('points').addEventListener('click',e=>{const k=e.target.closest('.k');if(k&&reciting)k.classList.toggle('open');});
$('points').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('k')&&reciting){e.preventDefault();e.target.classList.toggle('open');}});
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,.k'))return;if(e.key===' '){e.preventDefault();toggle();}else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);});
go(i);
})();
</script>
