<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>養分 教學動畫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  /* 版面：左邊是動畫舞台與播放控制，右邊是可遮字背誦的重點筆記；窄螢幕時上下堆疊 */
  --paper:#f2f2f0; --card:#ffffff; --ink:#1b2230; --muted:#5a6475; --line:#d5d9e2;
  --accent:#2f7a3a; --accent-soft:#dff0dc; --memo:#fff4cc;
  --display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:end;justify-content:space-between;padding:18px 20px 12px;max-width:1280px;margin:0 auto}
.eyebrow{font-size:13px;color:var(--muted);letter-spacing:.08em}
h1{font-family:var(--display);font-size:26px;margin:0;line-height:1.25}
nav{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,.k:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
nav button[aria-current="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,1fr);gap:18px;padding:0 20px 28px;max-width:1280px;margin:0 auto;align-items:start}
.stage,.notes{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.stagehead{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin-bottom:8px}
#num{font-size:13px;color:var(--accent);font-weight:700;letter-spacing:.06em}
h2{font-family:var(--display);font-size:22px;margin:0;text-wrap:balance}
svg#svg{display:block;width:100%;height:auto;background:#fafbfc;border:1px solid var(--line);border-radius:12px}
svg text{font-family:var(--body)}
.cap{min-height:3.2em;margin:10px 2px 8px;font-size:17px;font-weight:500}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700;min-width:116px;padding:10px 16px}
.primary:hover{filter:brightness(1.08)}
#seek{flex:1 1 160px;accent-color:var(--accent);min-width:120px}
.nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#steps{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0;justify-content:center;flex:1 1 200px}
#steps button{width:30px;height:30px;padding:0;border-radius:50%;font-size:13px;font-variant-numeric:tabular-nums}
#steps button.seen{background:var(--accent-soft);border-color:var(--accent)}
#steps button[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
#steps li.gap{width:8px}
#next.ready{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.noteshead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
h3{font-family:var(--display);font-size:19px;margin:0}
#recite[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#points{margin:12px 0;padding-left:1.2em;display:flex;flex-direction:column;gap:9px}
.k{font-weight:700;color:var(--accent);border-radius:4px;padding:0 2px}
.reciting .k{color:transparent;background:var(--accent-soft);border-bottom:2px solid var(--accent);cursor:pointer;user-select:none}
.reciting .k.open{color:var(--accent);background:none;border-bottom-color:transparent}
.rhyme{background:var(--memo);border-radius:12px;padding:10px 14px}
.rhyme span{font-size:12px;font-weight:700;letter-spacing:.1em;color:#7a5a00}
.rhyme p{margin:2px 0 0;font-family:var(--display);font-size:19px;line-height:1.5}
.hint{font-size:14px;color:var(--muted);margin:12px 2px 0}
@media (max-width:860px){main{grid-template-columns:1fr}h1{font-size:22px}}
</style>
</head>
<body>
<header>
  <div><div class="eyebrow">國中自然 1 上・第 2 章</div><h1>養分</h1></div>
  <nav id="units" aria-label="單元"></nav>
</header>
<main>
  <section class="stage" aria-label="動畫">
    <div class="stagehead"><span id="num"></span><h2 id="title"></h2></div>
    <svg id="svg" viewBox="0 0 800 450" role="img" aria-labelledby="title">
      <defs>
        <marker id="ahR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d43d3d"/></marker>
        <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a63c9"/></marker>
        <marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#56665e"/></marker>
        <linearGradient id="gcap" gradientUnits="userSpaceOnUse" x1="270" x2="530" y1="0" y2="0"><stop offset="0" stop-color="#e86a5e"/><stop offset="1" stop-color="#7f8fe0"/></linearGradient>
        <linearGradient id="gcap2" gradientUnits="userSpaceOnUse" x1="40" x2="520" y1="0" y2="0"><stop offset="0" stop-color="#f08a80"/><stop offset="1" stop-color="#a9b4ea"/></linearGradient>
      </defs>
      <g id="stat"></g><g id="dyn"></g>
    </svg>
    <p class="cap" id="cap" aria-live="polite"></p>
    <div class="controls">
      <button id="play" class="primary" type="button">▶ 開始</button>
      <button id="replay" type="button">↺ 從頭播放</button>
      <input type="range" id="seek" min="0" max="1000" value="0" aria-label="動畫進度">
    </div>
    <div class="nav">
      <button id="prev" type="button">← 上一階段</button>
      <ol id="steps" aria-label="階段"></ol>
      <button id="next" type="button">下一階段 →</button>
    </div>
  </section>
  <aside class="notes" id="notes" aria-label="重點歸納">
    <div class="noteshead"><h3>重點歸納</h3><button id="recite" type="button" aria-pressed="false">背誦模式：遮住關鍵字</button></div>
    <ul id="points"></ul>
    <div class="rhyme"><span>背誦口訣</span><p id="rhyme"></p></div>
    <p class="hint" id="hint"></p>
  </aside>
</main>

<script id="stages">
/* ---------- 繪圖小工具（只回傳 SVG 字串，不碰 DOM） ---------- */
const C={ink:'#1b2230',mut:'#56665e',P:'#d43d3d',N:'#2f6fd6',K:'#e08a1e',U:'#2f9e6b',E:'#7a4fc7',line:'#c9ced8',bg:'#fafbfc',cont:'#c9a66b',ocean:'#5b6b7d',mantle:'#e08a4a',asth:'#f0a868',core:'#f2c94c',sea:'#8cc4ee',magma:'#e2452f',lith:'#9a9b78'};
const LY=['#ead9a8','#c9b07a','#a98b5e','#8c6f4a'];
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const sg=(t,a,b)=>cl((t-a)/(b-a));
const lerp=(a,b,p)=>a+(b-a)*p;
const n1=n=>(Math.round(n*10)/10);
const PI=Math.PI,RAD=PI/180;
const dot=(x,y,r,fill,o=1,ex='')=>`<circle cx="${n1(x)}" cy="${n1(y)}" r="${n1(Math.max(0,r))}" fill="${fill}" opacity="${n1(cl(o)*100)/100}" ${ex}/>`;
const T=(x,y,s,o={})=>`<text x="${n1(x)}" y="${n1(y)}" text-anchor="${o.a||'middle'}" font-size="${o.z||17}" font-weight="${o.w||500}" fill="${o.f||C.ink}" opacity="${n1(cl(o.o??1)*100)/100}">${s}</text>`;
const AR=(x1,y1,x2,y2,c='R',w=4,o=1)=>`<line x1="${n1(x1)}" y1="${n1(y1)}" x2="${n1(x2)}" y2="${n1(y2)}" stroke="${{R:C.P,B:'#4a63c9',K:C.mut}[c]}" stroke-width="${w}" marker-end="url(#ah${c})" opacity="${o}"/>`;
const RC=(x,y,w,h,fill,ex='')=>`<rect x="${n1(x)}" y="${n1(y)}" width="${n1(Math.max(0,w))}" height="${n1(Math.max(0,h))}" fill="${fill}" ${ex}/>`;
const along=(pts,s)=>{for(let i=1;i<pts.length;i++){const[ax,ay]=pts[i-1],[bx,by]=pts[i],d=Math.hypot(bx-ax,by-ay);if(s<=d||i===pts.length-1){const p=d?cl(s/d):0;return[ax+(bx-ax)*p,ay+(by-ay)*p];}s-=d;}};
const plen=pts=>pts.slice(1).reduce((a,p,i)=>a+Math.hypot(p[0]-pts[i][0],p[1]-pts[i][1]),0);
const PL=(x,y,z=18,o=1)=>T(x,y+z*.35,'＋',{w:700,z,f:C.P,o}),MI=(x,y,z=18,o=1)=>T(x,y+z*.35,'－',{w:700,z,f:C.N,o});
const W=(d)=>`<path d="${d}" fill="none" stroke="${C.ink}" stroke-width="3" stroke-linejoin="round"/>`;
const bulb=(x,y,br)=>dot(x,y,24+10*br,'#f6c545',.45*br)+dot(x,y,15,'#fff',1,`stroke="${C.ink}" stroke-width="2.5"`)+dot(x,y,14,'#f6c545',br)+`<path d="M${x-8} ${y-8}L${x+8} ${y+8}M${x+8} ${y-8}L${x-8} ${y+8}" stroke="${C.ink}" stroke-width="1.5"/>`;
const batH=(x,y)=>RC(x-6,y-4,12,8,C.bg)+`<line x1="${x-6}" y1="${y-15}" x2="${x-6}" y2="${y+15}" stroke="${C.ink}" stroke-width="2.5"/><line x1="${x+6}" y1="${y-8}" x2="${x+6}" y2="${y+8}" stroke="${C.ink}" stroke-width="6"/>`+T(x-17,y-12,'＋',{z:12,f:C.P,w:700})+T(x+18,y-12,'－',{z:12,f:C.N,w:700});
const batV=(x,y)=>RC(x-4,y-6,8,12,C.bg)+`<line x1="${x-15}" y1="${y-6}" x2="${x+15}" y2="${y-6}" stroke="${C.ink}" stroke-width="2.5"/><line x1="${x-8}" y1="${y+6}" x2="${x+8}" y2="${y+6}" stroke="${C.ink}" stroke-width="6"/>`+T(x-24,y-8,'＋',{z:12,f:C.P,w:700})+T(x-24,y+16,'－',{z:12,f:C.N,w:700});
const flow=(pts,n,ph,col,r=5)=>{const L=plen(pts);let h='';for(let i=0;i<n;i++){const[x,y]=along(pts,(((ph+i/n)%1)+1)%1*L);h+=dot(x,y,r,col);}return h;};
const chips=(labs,act)=>labs.map((n,k)=>{const w=760/labs.length,x=20+w*k,a=act===k;return RC(x+4,372,w-8,34,a?C.E:'#fff',`rx="17" stroke="${a?C.E:'#d5d9e2'}" stroke-width="2"`)+T(x+w/2,395,n,{w:700,z:15,f:a?'#fff':k<act?C.ink:C.mut});}).join('');
const panels=`${[15,280,545].map(x=>`<rect x="${x}" y="50" width="240" height="270" rx="16" fill="#fff" stroke="#d5d9e2"/>`).join('')}`;


const UNITS=['食物中的養分','酵素','植物的養分','動物的養分','給你的話'];
const S=[];
const poly=(pts,fill,ex='')=>`<path d="M${pts.map(p=>n1(p[0])+' '+n1(p[1])).join('L')}Z" fill="${fill}" ${ex}/>`;
const SK='#f6e3d0',BLU='#2f6fd6',RED='#d43d3d',GRN='#2f9e6b',ORG='#e08a1e',PUR='#7a4fc7';
const LN=(pts,c,w,ex='')=>`<path d="M${pts.map(p=>n1(p[0])+' '+n1(p[1])).join('L')}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;
const sm=x=>x*x*(3-2*x);
const card=(x,y,w,h,ti,lines,c,o=1,act=true)=>`<g opacity="${n1(o*100)/100}">`+RC(x,y,w,h,'#fff',`rx="12" stroke="${act?c:'#d5d9e2'}" stroke-width="${act?2.5:1.5}"`)+T(x+w/2,y+26,ti,{w:700,z:16,f:c})+lines.map((s,i)=>T(x+w/2,y+50+22*i,s,{z:13})).join('')+'</g>';
const G=(o,inner)=>`<g opacity="${n1(cl(o)*100)/100}">${inner}</g>`;
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const mix=(a,b,p)=>{const A=hx(a),B=hx(b);p=cl(p);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*p).toString(16).padStart(2,'0')).join('');};
const seqc=(arr,p)=>{const x=cl(p)*(arr.length-1),i=Math.min(arr.length-2,Math.floor(x));return mix(arr[i],arr[i+1],x-i);};
const BEN=['#8fd0f0','#7cc47a','#e8d44a','#f09a3a','#d9482b'];
const tube=(x,top,bot,w,lv,col)=>{const r=w/2,l=Math.min(lv,bot-r);return `<path d="M${x-r} ${n1(l)}V${bot-r}A${r} ${r} 0 0 0 ${x+r} ${bot-r}V${n1(l)}Z" fill="${col}"/><path d="M${x-r} ${top}V${bot-r}A${r} ${r} 0 0 0 ${x+r} ${bot-r}V${top}" fill="none" stroke="${C.ink}" stroke-width="2.5"/>`;};
const beaker=(x1,y1,x2,y2,lv,col)=>RC(x1,lv,x2-x1,y2-lv,col,'opacity=".75"')+`<path d="M${x1} ${y1}V${y2}H${x2}V${y1}" fill="none" stroke="${C.ink}" stroke-width="2.5"/>`;
const flame=(x,y,k)=>`<path d="M${x} ${n1(y-18-4*k)}Q${x+14} ${y} ${x} ${y+8}Q${x-14} ${y} ${x} ${n1(y-18-4*k)}Z" fill="#f08a2a"/><path d="M${x} ${n1(y-8-2*k)}Q${x+6} ${y+2} ${x} ${y+6}Q${x-6} ${y+2} ${x} ${n1(y-8-2*k)}Z" fill="#f6d04a"/>`;
const ALL=(t,d)=>t<.01||t>=d-.1;

/* ---------- 1 六大養分與能量 ---------- */
const E3=[['醣類',4,ORG],['蛋白質',4,RED],['脂質',9,PUR]],N3=['水','礦物質','維生素'];
S.push({unit:0,title:'六大養分與能量',dur:15,loop:false,svg:
`${RC(20,48,490,218,'#fff','rx="14" stroke="#d5d9e2"')}${T(265,78,'可產生能量',{w:700,z:17,f:RED})}${RC(530,48,250,218,'#fff','rx="14" stroke="#d5d9e2"')}${T(655,78,'不能產生能量',{w:700,z:17,f:BLU})}
${T(400,396,'六大養分：醣類、蛋白質、脂質可產生能量；水、礦物質、維生素不能產生能量',{w:700,z:16})}${T(400,424,'1 大卡（千卡）＝ 1000 卡；1 卡的熱量可使 1 公克的水溫度升高 1℃',{z:14,f:C.mut})}`,
caps:[[0,'人體時時刻刻都在消耗能量，所以要攝取食物。食物裡的養分可以分成六大類。'],[1,'醣類、蛋白質、脂質可以產生能量。1 公克的醣類或蛋白質產生 4 大卡，1 公克的脂質產生 9 大卡。'],[6,'水、礦物質、維生素不能產生能量，但身體一樣需要它們。'],[9,'算算看：把每一種養分的公克數乘上它每公克的大卡數，再加起來。礦物質不產生能量，是 0。']],
tick(t){const A=ALL(t,15);let h='';
 E3.forEach(([n,k,c],i)=>{const y=96+54*i,o=A?1:sg(t,1+1.5*i,1.4+1.5*i);let g=RC(36,y,104,40,'#fff',`rx="10" stroke="${c}" stroke-width="2"`)+T(88,y+27,n,{w:700,z:16,f:c});
  for(let j=0;j<k;j++)g+=RC(156+25*j,y+9,21,22,c,`rx="4" opacity="${A?1:n1(sg(t,1.3+1.5*i+j*.11,1.5+1.5*i+j*.11))}"`);
  g+=T(390,y+27,'1 公克 '+k+' 大卡',{a:'start',z:14,w:700,o:A?1:sg(t,2.2+1.5*i,2.5+1.5*i)});h+=G(o,g);});
 N3.forEach((n,i)=>{const y=96+54*i;h+=G(A?1:sg(t,6+.7*i,6.5+.7*i),RC(546,y,218,40,'#fff',`rx="10" stroke="${BLU}" stroke-width="2"`)+T(562,y+27,n,{a:'start',w:700,z:16,f:BLU})+T(750,y+27,'0 大卡',{a:'end',z:13,f:C.mut}));});
 h+=T(400,296,'例：一份食物含有 醣類 20 g、蛋白質 10 g、脂質 5 g、礦物質 1 g',{z:15,o:A?1:sg(t,9,9.6)});
 [['醣類 20×4＝80',150,ORG],['蛋白質 10×4＝40',330,RED],['脂質 5×9＝45',500,PUR],['礦物質 0',650,BLU]].forEach(([s,x,c],i)=>h+=T(x,328,s,{z:15,w:700,f:c,o:A?1:sg(t,10+.8*i,10.4+.8*i)}));
 h+=T(400,360,'總熱量 ＝ 80 ＋ 40 ＋ 45 ＋ 0 ＝ 165 大卡',{w:700,z:17,o:A?1:sg(t,13.4,14)});
 return h;},
points:['食物中的養分分為六大類：<b>醣類</b>（碳水化合物）、<b>蛋白質</b>、<b>脂質</b>、<b>水</b>、<b>礦物質</b>、<b>維生素</b>。','可產生能量：<b>醣類、蛋白質、脂質</b>；不能產生能量：<b>水、礦物質、維生素</b>。','1 公克的醣類或蛋白質可產生 <b>4</b> 大卡的熱量；1 公克的脂質可產生 <b>9</b> 大卡。','1 大卡（千卡）＝ <b>1000</b> 卡；1 卡是使 1 公克水溫度升高 <b>1</b>℃ 所需的熱量。','點燃洋芋片可以使水溫<b>上升</b>，表示食物中含有能量。'],
rhyme:'醣四、蛋四、脂九；水、礦、維不產能。'});

/* ---------- 2 養分的重要性 ---------- */
const NUT=[['醣類',['纖維素：組成植物的細胞壁','澱粉、肝糖：儲存能量','　'],ORG],['蛋白質',['組成人類的肌肉','組成頭髮','　'],RED],['脂質',['細胞膜的主要成分','皮膚下層的脂質','可隔絕熱量散失（保溫）'],PUR],['水',['讓物質溶解成水溶液','有利物質的反應和運送','　'],BLU],['礦物質',['調節生理機能、組成構造','鐵：和造血功能有關','鈣：骨頭和牙齒的主要成分'],GRN],['維生素',['調節生理機能','缺維生素 A：夜盲症','缺維生素 C：壞血病'],'#b0457f']];
S.push({unit:0,title:'每一種養分都重要',dur:14,loop:false,svg:

  S.forEach((x,k)=>{x.btn.classList.toggle('seen',seen.has(k));x.btn.setAttribute('aria-current',k===i?'true':'false');});
  [...$('units').children].forEach((b,k)=>b.setAttribute('aria-current',k===s.unit?'true':'false'));
  $('hint').textContent=reciting?'點一下空格就能看答案。先在心裡說出答案，再點開核對。':seen.has(i)?(i<S.length-1?'看完了。試著不看筆記說一次重點，再按「下一階段」。':'全部看完了。開啟背誦模式，從第 1 階段再檢查一次自己。'):'按「開始」看動畫，隨時可以暫停或拖動進度條重看。';}
function go(k){i=cl(k,0,S.length-1);t=0;playing=false;const s=S[i];
  stat.innerHTML=s.svg;$('num').textContent=UNITS[s.unit]+'・階段 '+(i+1)+'／'+S.length;$('title').textContent=s.title;
  $('points').innerHTML=s.points.map(p=>'<li>'+p.replace(/<b>/g,'<b class="k" tabindex="0">')+'</li>').join('');$('rhyme').textContent=s.rhyme;
  try{localStorage.setItem('nutrient-stage',i);}catch(e){}
  draw();ui();}
function frame(now){if(!playing)return;t+=Math.min(.1,(now-last)/1000);last=now;const s=S[i];
  if(t>=s.dur&&!seen.has(i)){seen.add(i);ui();}
  if(!s.loop&&t>=s.dur){t=s.dur;playing=false;ui();}
  draw();if(playing)requestAnimationFrame(frame);}
function toggle(){const s=S[i];if(playing){playing=false;}else{if(!s.loop&&t>=s.dur)t=0;playing=true;last=performance.now();requestAnimationFrame(frame);}ui();}

play.addEventListener('click',toggle);
$('replay').addEventListener('click',()=>{t=0;draw();if(!playing)toggle();});
seek.addEventListener('input',()=>{playing=false;t=seek.value/1000*S[i].dur;draw();ui();});
next.addEventListener('click',()=>go(i+1));prev.addEventListener('click',()=>go(i-1));
$('recite').addEventListener('click',e=>{reciting=!reciting;notes.classList.toggle('reciting',reciting);e.currentTarget.setAttribute('aria-pressed',reciting);e.currentTarget.textContent=reciting?'顯示全部關鍵字':'背誦模式：遮住關鍵字';notes.querySelectorAll('.k.open').forEach(k=>k.classList.remove('open'));ui();});
$('points').addEventListener('click',e=>{const k=e.target.closest('.k');if(k&&reciting)k.classList.toggle('open');});
$('points').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('k')&&reciting){e.preventDefault();e.target.classList.toggle('open');}});
document.addEventListener('keydown',e=>{if(e.target.closest('button,input,.k'))return;if(e.key===' '){e.preventDefault();toggle();}else if(e.key==='ArrowRight')go(i+1);else if(e.key==='ArrowLeft')go(i-1);});
go(i);
})();
</script>
</body>
</html>
